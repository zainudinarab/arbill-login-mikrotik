<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <title>Logout Selesai - WiFi ARABPAY</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    function openLogin() {
      if (window.name != 'hotspot_logout') return true;
      open('$(link-login)', '_top');
      window.close();
      return false;
    }
  </script>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="wrapper">

    <!-- Header -->
    <div class="brand-header">
      <div class="brand-icon" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);">
        <svg viewBox="0 0 24 24">
          <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
        </svg>
      </div>
      <h1 class="brand-title">LOGOUT BERHASIL</h1>
      <div class="brand-subtitle">
        Sesi koneksi pengguna <strong>$(username)</strong> telah dihentikan.
      </div>
    </div>

    <!-- Summary Grid -->
    <div class="status-grid">
      <div class="status-card">
        <div class="status-label">IP Address</div>
        <div class="status-value">$(ip)</div>
      </div>
      
      <div class="status-card">
        <div class="status-label">MAC Address</div>
        <div class="status-value" style="font-size:0.85rem">$(mac)</div>
      </div>

      <div class="status-card">
        <div class="status-label">Total Durasi Pemakaian</div>
        <div class="status-value highlight">$(uptime)</div>
      </div>

      <div class="status-card">
        <div class="status-label">Total Data Digunakan</div>
        <div class="status-value highlight">$(bytes-in-nice) / $(bytes-out-nice)</div>
      </div>
    </div>

    <!-- Login Again Button -->
    <form action="$(link-login)" name="login" onSubmit="return openLogin()">
      <button type="submit" class="btn-submit">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
        </svg>
        <span>LOGIN KEMBALI</span>
      </button>
    </form>

    <!-- Footer -->
    <div class="footer-text">
      <strong>WiFi ARABPAY Hotspot Digital</strong><br>
      Terima kasih telah menggunakan layanan kami.
    </div>

  </div>

</body>
</html>
