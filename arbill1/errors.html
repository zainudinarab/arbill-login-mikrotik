<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <title>Kesalahan Koneksi Hotspot</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="wrapper">
    <div class="brand-header">
      <div class="brand-icon" style="background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
      </div>
      <h1 class="brand-title">TERJADI KESALAHAN</h1>
      <div class="brand-subtitle">
        Tidak dapat memproses permintaan Anda
      </div>
    </div>

    <div class="alert alert-danger">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
      <div>$(error)</div>
    </div>

    <a href="$(link-login)" class="btn-submit" style="text-decoration:none;">
      <span>KEMBALI KE HALAMAN LOGIN</span>
    </a>
  </div>

</body>
</html>
