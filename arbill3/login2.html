<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Hotspot</title>
    <style>
        /* Style untuk loader */
        #loader {
            display: none; /* Loader akan disembunyikan secara default */
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9); /* Latar belakang transparan */
            text-align: center;
            padding-top: 20%;
            font-size: 20px;
            color: #333;
        }
        .login-form {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background: #f7f7f7;
            border-radius: 10px;
            box-shadow: 0px 0px 10px 0px #000;
        }
        .login-form input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .login-form button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .login-form button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<!-- Elemen loader yang akan muncul saat proses login -->
<div id="loader">Loading... Mohon Tunggu</div>

<!-- Formulir login untuk Hotspot -->
<div class="login-form">
    <h2>Login Hotspot</h2>
    <form action="/login" method="post" id="loginForm">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>

<script>
// Fungsi untuk menampilkan loader dengan efek fade-in dan fade-out
document.addEventListener('DOMContentLoaded', function () {
    var loader = document.getElementById("loader");

    // Menampilkan loader saat form disubmit
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        loader.style.display = "block"; // Tampilkan loader saat form dikirim

        setTimeout(() => {
            var loaderOpacity = 1;
            var fadeAnimation = setInterval(() => {
                if (loaderOpacity <= 0.05) {
                    clearInterval(fadeAnimation);
                    loader.style.opacity = "0";
                    loader.style.display = "none"; // Sembunyikan loader setelah fade-out
                }
                loader.style.opacity = loaderOpacity;
                loader.style.filter = "alpha(opacity=" + loaderOpacity * 100 + ")";
                loaderOpacity = loaderOpacity - loaderOpacity * 0.5;
            }, 30);
        }, 400);
    });
});
</script>

</body>
</html>
